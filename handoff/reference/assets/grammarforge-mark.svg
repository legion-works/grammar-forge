<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GrammarForge mark">
  <defs>
    <linearGradient id="gfCaret" x1="24" y1="12" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7f2ff"></stop>
      <stop offset="55%" stop-color="#86e1fc"></stop>
      <stop offset="100%" stop-color="#82aaff"></stop>
    </linearGradient>
    <radialGradient id="gfCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8faff"></stop>
      <stop offset="55%" stop-color="#86e1fc"></stop>
      <stop offset="100%" stop-color="#82aaff"></stop>
    </radialGradient>
    <radialGradient id="gfEmber" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffe6cf"></stop>
      <stop offset="60%" stop-color="#ffc777"></stop>
      <stop offset="100%" stop-color="#ff966c"></stop>
    </radialGradient>
    <filter id="gfGlow" x="-70%" y="-70%" width="240%" height="240%">
