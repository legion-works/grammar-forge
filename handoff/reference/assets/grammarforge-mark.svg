    <line x1="18.75" y1="37.5" x2="23" y2="37.5" stroke="#eab308"></line>
    <line x1="25" y1="37.5" x2="29.25" y2="37.5" stroke="#06b6d4"></line>
    <line x1="31.25" y1="37.5" x2="35.5" y2="37.5" stroke="#8b5cf6"></line>
  </g>

  
  <path d="M12.5 28.5 L24 14 L35.5 28.5" fill="none" stroke="url(#gfCaret)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gfGlow)"></path>

  
  <circle cx="29.4" cy="9.1" r="1.15" fill="url(#gfEmber)" opacity="0.92"></circle>
  <circle cx="20.6" cy="7.9" r="0.85" fill="url(#gfEmber)" opacity="0.85"></circle>

  
  <circle cx="24" cy="14" r="3.5" fill="url(#gfCore)" filter="url(#gfGlow)"></circle>
