name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - bridge
        - browser
        - vencord
        - opencode
        - eval
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bridge version (`/health` response or git describe) and client version if applicable.
      placeholder: "0.1.0"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Bridge logs (`docker compose logs bridge`), browser console, or eval output.
      render: text
