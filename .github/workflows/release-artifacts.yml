name: release-artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build artifacts for, e.g. grammar-forge-v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-bridge-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "version=${TAG#grammar-forge-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/legion-works/grammar-forge-bridge
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: bridge/
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: |
            org.opencontainers.image.source=https://github.com/legion-works/grammar-forge

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/browser/pnpm-lock.yaml

      - name: Install browser dependencies
        run: pnpm install
        working-directory: clients/browser

      - name: Build browser extension
        run: pnpm run build
        working-directory: clients/browser

      - name: Package Chrome extension
        run: pnpm run zip
        working-directory: clients/browser

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            clients/browser/.output/*-chrome.zip \
            --clobber

  # master is the release-only mirror — fast-forward to the published tag
  sync-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Fast-forward master to the release tag
        run: |
          git push origin "refs/tags/${{ github.event.release.tag_name || inputs.tag }}^{commit}:refs/heads/master"
