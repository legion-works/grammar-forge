name: release-artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build artifacts for, e.g. grammar-forge-v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Build each platform on a native runner — no QEMU emulation.
  # The per-leg images are pushed by digest only (no tags); a
  # downstream merge job assembles the multi-arch manifest list.
  publish-bridge-image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: bridge/
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/legion-works/grammar-forge-bridge,push-by-digest=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  # Merge per-platform digests into a single multi-arch manifest list
  # and push with the release version + latest tags.
  merge-bridge-manifest:
    needs: [publish-bridge-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "version=${TAG#grammar-forge-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list and push
        env:
          IMAGE: ghcr.io/legion-works/grammar-forge-bridge
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          refs=()
          for f in /tmp/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "version=${TAG#grammar-forge-v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/browser/pnpm-lock.yaml

      # --- Browser (Chrome) ---
      - name: Install browser dependencies
        run: pnpm install
        working-directory: clients/browser

      - name: Build + package Chrome extension
        run: pnpm run zip
        working-directory: clients/browser

      # --- Browser (Firefox) ---
      - name: Build + package Firefox extension
        # Invoke wxt directly (not the zip:firefox script) so workflow_dispatch
        # builds of tags that predate the script still work.
        run: pnpm exec wxt zip -b firefox
        working-directory: clients/browser

      # --- Vencord ---
      - name: Install Vencord dependencies
        run: pnpm install
        working-directory: clients/vencord

      - name: Build Vencord plugin
        run: pnpm run build
        working-directory: clients/vencord

      - name: Package Vencord plugin
        run: |
          mkdir -p .output
          cd dist
          zip -r "../.output/grammarforge-vencord-${{ steps.ver.outputs.version }}.zip" grammarForge/
        working-directory: clients/vencord

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            clients/browser/.output/*-chrome.zip \
            clients/browser/.output/*-firefox.zip \
            clients/vencord/.output/*.zip \
            --clobber

  # master is the release-only mirror — fast-forward to the published tag
  sync-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Fast-forward master to the release tag
        run: |
          git push origin "refs/tags/${{ github.event.release.tag_name || inputs.tag }}^{commit}:refs/heads/master"
