name: ci
on:
  pull_request:
    branches: [master, main, dev]
  push:
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'bridge/**'
            proto:
              - 'bridge/proto/**'
              - 'bridge/buf.yaml'
              - 'bridge/buf.gen.yaml'
            docker:
              - 'Dockerfile*'
              - '**/Dockerfile'
              - 'docker-compose*.yml'
              - 'config/**'
              - 'scripts/**'
              - '.yamllint'
              - '.dclintrc'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact .

  # The GH runner has no native libs (libharper_c.so, libonnxruntime.so,
  # libtokenizers.a) and no GECToR model on disk, so we cannot exercise the
  # CGo/ONNX packages here. The harperffi + gector packages are gated by
  # `docker build` + local `task test`; this job only builds/tests the rest.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: bridge/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: bridge
          version: v2.1.0
      # Pipe to xargs: quoting $(go list) collapses the package list into one
      # bad arg; xargs splits it correctly and keeps actionlint happy (no $()).
      - name: build (non-cgo packages)
        run: go list ./... | grep -vE '/(harperffi|gector)$' | xargs go build
      # No -race: the Go race detector needs cgo and the GH runner has no
      # native libs; race coverage is provided by the CGo gate in `task test`.
      - name: test (non-cgo packages)
        run: go list ./... | grep -vE '/(harperffi|gector)$' | xargs go test -count=1
      - name: govulncheck (non-cgo packages)
        run: go list ./... | grep -vE '/(harperffi|gector)$' | xargs go run golang.org/x/vuln/cmd/govulncheck@latest

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.70.0
      - name: buf lint
        run: buf lint
      # First proto introduction has no baseline; buf breaking fails when
      # there is no prior .proto to compare against. Skip the breaking
      # check on the very first run (when bridge/proto/ml_server.proto
      # was not present in the merge-base) so we still get a green CI.
      - name: buf breaking (skip if first proto introduction)
        run: |
          git fetch --depth=1 origin master
          if git cat-file -e master:bridge/proto/ml_server.proto 2>/dev/null; then
            buf breaking --against '.git#branch=master,subdir=bridge'
          else
            echo "proto first introduction: skipping breaking check (no prior proto on master)"
          fi
      - name: codegen-drift gate
        run: buf generate && git diff --exit-code -- internal/ltgrpc/pb

  # Infra lint: Dockerfile + compose + yaml + shell. No GPU on the GH runner
  # so the full e2e (`./scripts/e2e.sh` / `docker compose up`) is a local
  # task documented in the README; this job only statically validates the
  # infra so a green CI = the stack can be brought up.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint bridge/Dockerfile
        # --failure-threshold error: only fail on real errors. The current
        # Dockerfile (Plan 1C) emits DL3008/DL3003/DL3059 warnings about
        # unpinned apt versions and consolidated RUN steps; those are
        # pre-existing best-practice nits, not bugs.
        run: docker run --rm -i --entrypoint=hadolint hadolint/hadolint --failure-threshold error - < bridge/Dockerfile
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint docker-compose.yml config/
      - name: docker compose config (parse check)
        run: docker compose config -q
      - name: shellcheck scripts/*.sh
        run: shellcheck scripts/*.sh
      - name: dclint docker-compose.yml
        run: npx --yes dclint docker-compose.yml

  ci-complete:
    needs: [secrets, go, proto, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.secrets.result }}" != "success" ]; then echo "secrets failed"; exit 1; fi
          if [ "${{ needs.go.result }}" != "success" ] && [ "${{ needs.go.result }}" != "skipped" ]; then echo "go failed"; exit 1; fi
          if [ "${{ needs.proto.result }}" != "success" ] && [ "${{ needs.proto.result }}" != "skipped" ]; then echo "proto failed"; exit 1; fi
          if [ "${{ needs.docker.result }}" != "success" ] && [ "${{ needs.docker.result }}" != "skipped" ]; then echo "docker failed"; exit 1; fi
          echo "ci-complete: ok"
