name: release-please

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: dev

      - name: Dispatch artifact build
        if: ${{ steps.rp.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -R is required: this job never checks out the repo, so gh cannot
        # infer the repository from a working tree.
        run: gh workflow run release-artifacts.yml -R "${{ github.repository }}" -f tag="${{ steps.rp.outputs.tag_name }}"
