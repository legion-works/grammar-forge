<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrammarForge</title>
    <!-- Legion Works type stack (handoff/scss/_tokens.scss $gf-font-*): Space
         Grotesk (display/wordmark) + JetBrains Mono (machine data) from Google
         Fonts; Geist (UI) from jsDelivr's fontsource mirror. Best-effort — the
         CSS font stacks in popup.css already fall back to system-ui/ui-sans-serif
         if a fetch is blocked (e.g. offline dev). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
