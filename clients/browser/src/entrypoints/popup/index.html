         Grotesk (display/wordmark), JetBrains Mono (machine data), and Geist
         Sans (UI) are bundled locally via @fontsource — see main.tsx's imports.

         and CSP problem, so no external <link> tags here; the CSS font
         stacks in popup.css still fall back to system-ui/ui-sans-serif if a
         font somehow fails to apply. -->
