version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/grammarforge/bridge/internal/ltgrpc/pb
plugins:
  # Pin versions so regeneration stays reproducible across upstream releases.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: internal/ltgrpc/pb
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: internal/ltgrpc/pb
    opt: paths=source_relative
