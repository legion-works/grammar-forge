version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/grammarforge/bridge/internal/ltgrpc/pb
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/ltgrpc/pb
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: internal/ltgrpc/pb
    opt: paths=source_relative
