# Fast git hooks. Activate with `lefthook install`. Docs: https://lefthook.dev
pre-commit:
  parallel: true
  commands:
    gitleaks:
      # secret scan of staged changes — public repo, must gate.
      # newer gitleaks (>=8.18) may prefer `gitleaks git --staged`; adjust to the installed version.
      run: gitleaks protect --staged --redact --no-banner
    golangci-lint:
      root: bridge/
      glob: "*.go"
      run: golangci-lint run
    browser-lint:
      root: clients/browser/
      glob: "*.{ts,tsx}"
      run: pnpm run lint
    browser-typecheck:
      root: clients/browser/
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck
    vencord-lint:
      root: clients/vencord/
      glob: "*.{ts,tsx}"
      run: pnpm run lint
    vencord-typecheck:
      root: clients/vencord/
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck
    opencode-lint:
      root: clients/opencode/
      glob: "*.{ts,tsx}"
      run: pnpm run lint
    opencode-typecheck:
      root: clients/opencode/
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck
